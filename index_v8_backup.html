ius:16px;background:#fff;text-align:left;width:100%}.daynum{width:38px;height:38px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-weight:800}.day .meta{flex:1}.day .arrow{color:var(--muted);font-size:20px}.exercise{padding:15px 0;border-top:1px solid var(--line)}.exercise:first-child{border-top:0}.exercise h3{font-size:16px;margin:0 0 3px}.exercise .range{font-size:12px;color:var(--muted)}.rec{margin-top:8px;font-size:12px;color:var(--green);font-weight:700}.setrow{display:grid;grid-template-columns:28px 1fr 1fr 68px;gap:7px;align-items:center;margin-top:8px}.setnum{font-size:11px;color:var(--muted);font-weight:700;text-align:center}.setrow input,.edit input,.edit select,.bodyinput{width:100%;padding:10px;border:1px solid var(--line);border-radius:11px;background:#fafaf8;outline:none}.setrow input:focus,.edit input:focus{border-color:#bbb}.donebtn{background:var(--soft);color:var(--ink);padding:10px 7px;border-radius:11px;font-size:11px;font-weight:750}.donebtn.done{background:#e7f6ed;color:var(--green)}.progressbar{height:8px;background:#ecece7;border-radius:99px;overflow:hidden}.progressbar>div{height:100%;background:var(--ink);border-radius:99px}.chart{height:120px;display:flex;align-items:flex-end;gap:7px;padding:12px 3px 4px}.baritem{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:5px}.baritem i{display:block;background:#171717;border-radius:5px 5px 2px 2px;min-height:5px}.baritem span{font-size:9px;color:var(--muted);text-align:center}.historyitem{padding:13px 0;border-top:1px solid var(--line)}.historyitem:first-child{border-top:0}.edit{display:grid;gap:9px}.editrow{border:1px solid var(--line);border-radius:15px;padding:12px;background:#fff}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.editgrid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:7px}.notice{padding:12px;border-radius:14px;background:var(--soft);font-size:12px;color:#5f5f5f}.empty{text-align:center;padding:38px 12px;color:var(--muted)}.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(6,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-top:1px solid var(--line);box-shadow:0 -8px 28px rgba(0,0,0,.07)}.navbtn{background:transparent;color:#8a8a8a;padding:6px 2px 4px;border-radius:13px;font-size:10px;font-weight:700}.navbtn.active{color:var(--ink);background:var(--soft)}.navicon{display:block;font-size:19px;line-height:19px;margin-bottom:3px}.top-actions{display:flex;gap:7px}.back{background:var(--soft);color:var(--ink);padding:8px 10px;border-radius:10px;font-weight:700}
.timerCard{background:#eef9f3;border:1px solid #d8eee1}.timerTitle{font-size:18px;font-weight:800}.timerSub{font-size:12px;color:var(--muted);margin-top:3px}.timerWrap{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:14px}.timerCircle{width:138px;height:138px;border-radius:50%;border:8px solid #cfe5d8;display:grid;place-items:center;background:#fff;box-shadow:inset 0 0 0 1px #e6eee9}.timerCircle strong{display:block;font-size:29px;letter-spacing:-.04em;text-align:center}.timerCircle span{display:block;font-size:11px;color:var(--muted);text-align:center;margin-top:2px}.timerActions{display:grid;gap:8px;min-width:120px}.timerPrimary{background:var(--green);color:#fff;padding:11px 14px;border-radius:12px;font-weight:800}.timerReset{background:#fff;color:var(--ink);padding:10px 14px;border-radius:12px;font-weight:700;border:1px solid var(--line)}.timerNote{font-size:11px;color:var(--muted);margin-top:12px}.restSettings{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.restSetting{background:var(--soft);border-radius:14px;padding:11px}.restSetting label{display:block;font-size:10px;color:var(--muted);font-weight:700;margin-bottom:5px}.restSetting input{width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;background:#fff}

@media(max-width:520px){.guideBody{grid-template-columns:1fr}.diagram{min-height:135px}.diagram svg{height:132px}}
.nutriHero{background:linear-gradient(135deg,#eef9f3,#f5f7ff);border:1px solid #dfe9e3}.macroGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.macroStat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px}.macroStat .n{font-size:20px;font-weight:800}.macroStat .l{font-size:10px;color:var(--muted);font-weight:700;margin-top:2px}.macroStat .target{font-size:10px;color:var(--muted);margin-top:4px}.macroBar{height:7px;background:#ecece7;border-radius:99px;overflow:hidden;margin-top:8px}.macroBar i{display:block;height:100%;background:var(--blue);border-radius:99px}.macroRemain{font-size:11px;color:var(--muted);margin-top:5px}.mealTable{display:grid;gap:8px}.mealRow{display:grid;grid-template-columns:1.7fr .65fr .8fr .75fr .75fr .75fr auto;gap:6px;align-items:center}.mealRow.head{font-size:9px;color:var(--muted);font-weight:800;text-transform:uppercase}.mealRow input{min-width:0;padding:9px 8px;border:1px solid var(--line);border-radius:10px;background:#fafaf8}.mealRemove{background:#fff0f0;color:#b42318;padding:8px 9px;border-radius:10px;font-weight:800}.mealTotal{display:grid;grid-template-columns:1.7fr .65fr .8fr .75fr .75fr .75fr auto;gap:6px;align-items:center;padding-top:10px;border-top:1px solid var(--line);font-weight:800;font-size:12px}.mealTotal span{text-align:center}.mealTotal .label{text-align:left}.mealActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.mealList{display:grid;gap:8px}.mealItem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:13px;background:#fff}.mealItem b{font-size:13px}.mealItem .nums{font-size:11px;color:var(--muted);margin-top:3px}.calcHint{padding:11px 12px;border-radius:13px;background:var(--soft);font-size:11px;color:#666;line-height:1.45}.macroInputGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.macroInputGrid label{font-size:10px;color:var(--muted);font-weight:700}.macroInputGrid input{width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.nutritionEmpty{padding:20px 5px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:520px){.macroGrid{grid-template-columns:repeat(2,1fr)}.mealRow,.mealTotal{grid-template-columns:1.4fr .55fr .75fr .7fr .7fr .7fr 38px}.mealRow input{padding:8px 6px;font-size:12px}.mealRow.head{font-size:8px}.macroInputGrid{grid-template-columns:repeat(2,1fr)}}

<body>
<div class="app">
<header class="top"><div class="eyebrow">Training</div><h1>Physique Tracker</h1><p>Lift smarter. Track progress. Build consistently.</p></header>
<main class="content">
<section id="todayView" class="view active"></section>
<section id="workoutsView" class="view"></section>
<section id="activeView" class="view"></section>
<section id="progressView" class="view"></section>
<section id="historyView" class="view"></section>
<section id="settingsView" class="view"></section>
<section id="nutritionView" class="view"></section>
</main>
<nav class="bottomnav" aria-label="Main navigation">
<button class="navbtn active" data-nav="today"><span class="navicon">⌂</span>Today</button>
<button class="navbtn" data-nav="workouts"><span class="navicon">▣</span>Workouts</button>
<button class="navbtn" data-nav="progress"><span class="navicon">↗</span>Progress</button>
<button class="navbtn" data-nav="history"><span class="navicon">◷</span>History</button>
<button class="navbtn" data-nav="nutrition"><span class="navicon">◉</span>Nutrition</button>
<button class="navbtn" data-nav="settings"><span class="navicon">⚙</span>Settings</button>
</nav></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script>
const KEY='physiqueTrackerDataV5';
const defaultPlans=[
{name:'Chest + Shoulders',ex:[['Incline Barbell Press',4,6,8,'compound'],['Flat Dumbbell Press',3,8,10,'compound'],['Cable Fly',3,10,15,'isolation'],['Seated Overhead Press',3,6,10,'compound'],['Cable Lateral Raise',4,12,20,'isolation'],['Triceps Pressdown',3,10,15,'isolation']]},
{name:'Back + Biceps',ex:[['Pull-Ups / Lat Pulldown',4,6,10,'compound'],['Chest-Supported Row',3,8,12,'compound'],['Single-Arm Lat Pulldown',3,10,12,'isolation'],['Cable Row',3,10,15,'compound'],['Rear-Delt Fly',3,15,20,'isolation'],['Hammer Curl',3,8,12,'isolation'],['Incline Curl',3,10,15,'isolation']]},
{name:'Legs + Abs',ex:[['Squat / Hack Squat',3,6,10,'compound'],['Romanian Deadlift',3,8,10,'compound'],['Leg Press',3,10,15,'compound'],['Leg Curl',3,10,15,'isolation'],['Calf Raise',4,10,15,'isolation'],['Hanging Leg Raise',3,10,15,'isolation'],['Cable Crunch',3,10,15,'isolation']]},
{name:'Upper Body',ex:[['Incline Dumbbell Press',4,8,12,'compound'],['Weighted Pull-Up',4,6,10,'compound'],['Machine Chest Press',3,8,12,'compound'],['Cable Row',3,8,12,'compound'],['Lateral Raise',4,12,20,'isolation'],['Triceps Extension',3,10,15,'isolation'],['Biceps Curl',3,10,15,'isolation']]},
{name:'Delts + Arms',ex:[['Lateral Raise',5,12,20,'isolation'],['Rear Delts',4,15,20,'isolation'],['Shoulder Press',3,8,12,'compound'],['Triceps',4,10,15,'isolation'],['Biceps',4,10,15,'isolation']]}
];
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{plans:JSON.parse(JSON.stringify(defaultPlans)),history:[],settings:{unit:'lb'},body:[]};
if(!data.settings)data.settings={unit:'lb'};if(!data.settings.rest)data.settings.rest={compound:150,isolation:75};if(!data.history)data.history=[];if(!data.body)data.body=[];if(!data.nutrition)data.nutrition={targets:{calories:2450,protein:180,carbs:280,fat:70},today:[],calc:[{food:'',servings:1,calories:'',protein:'',carbs:'',fat:''}]};if(!data.nutrition.targets)data.nutrition.targets={calories:2450,protein:180,carbs:280,fat:70};if(!data.nutrition.today)data.nutrition.today=[];if(!data.nutrition.calc?.length)data.nutrition.calc=[{food:'',servings:1,calories:'',protein:'',carbs:'',fat:''}];
let nav='today',day=0,session={},timerSeconds=150,timerRunning=false,timerInterval=null,timerType='compound';
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(data));if(window.PT_CLOUD?.user)cloudSaveAll()}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function latest(name){for(let i=data.history.length-1;i>=0;i--){let x=data.history[i].ex.find(e=>e.name===name);if(x)return x}}
function rec(ex){let p=latest(ex[0]);if(!p)return 'First time — choose a challenging weight.';let all=p.sets.length&&p.sets.every(s=>Number(s.reps)>=ex[3]);if(all)return `Progression: +${ex[4]==='compound'?5:2.5} ${data.settings.unit} next time`;return `Keep the weight and aim for ${ex[2]}–${ex[3]} reps`}
function setCount(p){return p.ex.reduce((a,e)=>a+e[1],0)}
function completed(p){return Object.values(session).filter(Boolean).length}
function show(name){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$(name+'View').classList.add('active');document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.nav===name));nav=name;window.scrollTo({top:0,behavior:'smooth'});renderCurrent()}
function renderCurrent(){if(nav==='today')renderToday();if(nav==='workouts')renderWorkouts();if(nav==='progress')renderProgress();if(nav==='history')renderHistory();if(nav==='settings')renderSettings();if(nav==='nutrition')renderNutrition();if(nav==='active')renderActive()}
function renderToday(){let p=data.plans[day], total=setCount(p),done=completed(p), recent=data.history[data.history.length-1];$('todayView').innerHTML=`<div class="hero"><h2>Ready to train?</h2><p>Pick up where you left off and beat your last session.</p></div><div class="card"><div class="row"><div><div class="pill">TODAY'S WORKOUT</div><div class="title" style="margin-top:8px">${esc(p.name)}</div><div class="muted small">${p.ex.length} exercises • ${total} sets</div></div><button class="primary" data-start="${day}">Start</button></div><div class="progressbar" style="margin-top:15px"><div style="width:${total?done/total*100:0}%"></div></div></div><div class="statgrid"><div class="stat"><div class="n">${data.history.length}</div><div class="l">WORKOUTS</div></div><div class="stat"><div class="n">${data.history.reduce((a,h)=>a+h.ex.reduce((b,e)=>b+e.sets.length,0),0)}</div><div class="l">TOTAL SETS</div></div><div class="stat"><div class="n">${data.body.length?data.body[data.body.length-1].weight:'—'}</div><div class="l">${data.settings.unit.toUpperCase()}</div></div></div><div class="card"><div class="row"><div><div class="title">Nutrition</div><div class="muted small">${nutritionTotals().calories} / ${data.nutrition.targets.calories} kcal • ${nutritionTotals().protein}g protein</div></div><button class="secondary" data-nav="nutrition">Open</button></div><div class="progressbar" style="margin-top:10px"><div style="width:${Math.min(100,nutritionTotals().calories/Math.max(1,data.nutrition.targets.calories)*100)}%"></div></div></div>${recent?`<div class="card"><div class="title">Last session</div><div class="historyitem"><b>${esc(recent.plan)}</b><div class="muted small">${new Date(recent.date).toLocaleDateString()}</div></div></div>`:''}`}
function renderWorkouts(){let p=data.plans[day];$('workoutsView').innerHTML=`<div class="hero"><h2>Workouts</h2><p>Your complete training split. Always available.</p></div><div class="daylist">${data.plans.map((p,i)=>`<button class="day" data-start="${i}"><div class="daynum">${i+1}</div><div class="meta"><b>${esc(p.name)}</b><div class="muted small">${p.ex.length} exercises • ${setCount(p)} sets</div></div><div class="arrow">›</div></button>`).join('')}</div><div class="card"><div class="title">Exercise form guides</div><div class="muted small" style="margin-top:5px">Every exercise includes a movement diagram, target muscles, and form cues inside the workout.</div></div><div class="card"><div class="row"><div><div class="title">Quick start</div><div class="muted small">Continue your current day.</div></div><button class="secondary" data-start="${day}">Start Day ${day+1}</button></div></div>`}
function timerDefault(type){return Number(data.settings.rest?.[type]|| (type==='compound'?150:75))}
function fmtTimer(sec){let m=Math.floor(sec/60),s=sec%60;return m+':'+String(s).padStart(2,'0')}
function stopTimer(){timerRunning=false;if(timerInterval){clearInterval(timerInterval);timerInterval=null}renderTimer()}
function resetTimer(type=timerType){stopTimer();timerType=type;timerSeconds=timerDefault(type);renderTimer()}
function startTimer(type=timerType){if(type!==timerType||!timerSeconds){timerType=type;timerSeconds=timerDefault(type)}if(timerRunning)return;timerRunning=true;renderTimer();timerInterval=setInterval(()=>{if(timerSeconds>0){timerSeconds--;renderTimer()}if(timerSeconds<=0){stopTimer();try{navigator.vibrate?.([180,100,180])}catch(_){}}},1000)}
function renderTimer(){let el=$('restTimer');if(!el)return;let label=timerRunning?'Resting':(timerSeconds<timerDefault(timerType)?'Paused':'Ready');el.querySelector('[data-time]').textContent=fmtTimer(Math.max(0,timerSeconds));el.querySelector('[data-status]').textContent=label;el.querySelector('[data-type]').textContent=(timerType==='compound'?'Compound':'Isolation')+' exercise • '+fmtTimer(timerDefault(timerType))+' default';let b=el.querySelector('[data-timer-action]');b.textContent=timerRunning?'Pause':'Start';}
function timerCard(){return `<div class="card timerCard" id="restTimer"><div class="row"><div><div class="timerTitle">Rest Timer</div><div class="timerSub" data-type></div></div><span class="pill">Auto-start</span></div><div class="timerWrap"><div class="timerCircle"><div><strong data-time>${fmtTimer(timerSeconds)}</strong><span data-status>${timerRunning?'Resting':'Ready'}</span></div></div><div class="timerActions"><button class="timerPrimary" data-timer-action>${timerRunning?'Pause':'Start'}</button><button class="timerReset" data-timer-reset>Reset</button></div></div><div class="timerNote">Starts automatically when you complete a set. Adjust defaults in Settings.</div></div>`}
const GUIDE={
"Incline Barbell Press":{kind:'inclinepress',muscles:'Upper chest • front delts • triceps',tips:['Set the bench around 30–45° and keep feet planted.','Lower the bar with control toward the upper chest.','Keep wrists stacked and elbows roughly 30–45° from your torso.']},
"Flat Dumbbell Press":{kind:'dbpress',muscles:'Chest • front delts • triceps',tips:['Keep shoulder blades pulled gently back into the bench.','Lower dumbbells under control with forearms vertical.','Press up without letting the shoulders roll forward.']},
"Cable Fly":{kind:'fly',muscles:'Chest',tips:['Use a soft elbow bend and keep it consistent.','Bring the handles together by moving the upper arms, not the hands.','Control the stretch; do not let the shoulders dump forward.']},
"Seated Overhead Press":{kind:'ohp',muscles:'Shoulders • triceps',tips:['Brace your core and keep ribs down.','Press in a smooth path slightly back over your head.','Avoid excessive lower-back arching.']},
"Cable Lateral Raise":{kind:'lateral',muscles:'Lateral delts',tips:['Lead with the elbows and keep a slight bend.','Raise to about shoulder height.','Use light weight and avoid swinging.']},
"Triceps Pressdown":{kind:'pressdown',muscles:'Triceps',tips:['Pin elbows close to your sides.','Extend fully without snapping the elbows.','Control the handle back up without leaning.']},
"Pull-Ups / Lat Pulldown":{kind:'pulldown',muscles:'Lats • biceps • upper back',tips:['Start with shoulders set down away from your ears.','Pull elbows toward your ribs.','Control the return to a full comfortable stretch.']},
"Chest-Supported Row":{kind:'row',muscles:'Mid back • lats • rear delts',tips:['Keep your chest supported throughout.','Drive elbows back and squeeze shoulder blades.','Lower slowly; do not shrug.']},
"Single-Arm Lat Pulldown":{kind:'pulldown1',muscles:'Lats • biceps',tips:['Keep torso stable and shoulder down.','Pull elbow toward your hip.','Let the arm reach up under control.']},
"Cable Row":{kind:'rowcable',muscles:'Mid back • lats • biceps',tips:['Sit tall with a neutral spine.','Pull toward the lower ribs and squeeze.','Do not turn it into a backward lean.']},
"Rear-Delt Fly":{kind:'rearfly',muscles:'Rear delts • upper back',tips:['Keep a soft elbow bend and hinge slightly.','Move arms out and back without shrugging.','Use a weight you can control through the full arc.']},
"Hammer Curl":{kind:'curl',muscles:'Biceps • brachialis • forearms',tips:['Keep palms facing each other.','Pin elbows near your torso.','Curl without swinging your shoulders.']},
"Incline Curl":{kind:'inclinecurl',muscles:'Biceps',tips:['Let arms hang naturally behind the torso.','Curl while keeping upper arms still.','Lower slowly into the stretch.']},
"Squat / Hack Squat":{kind:'squat',muscles:'Quads • glutes • hamstrings',tips:['Brace before each rep and keep knees tracking over toes.','Descend as deep as your mobility allows while staying controlled.','Drive through the floor without collapsing the chest.']},
"Romanian Deadlift":{kind:'rdl',muscles:'Hamstrings • glutes • lower back',tips:['Push hips back while keeping the bar close.','Maintain a neutral spine and soft knees.','Stop when hamstrings are fully stretched without rounding.']},
"Leg Press":{kind:'legpress',muscles:'Quads • glutes • hamstrings',tips:['Keep your lower back and hips against the pad.','Lower the platform under control.','Press through the whole foot and avoid locking out hard.']},

function nutritionTotals(){let t={calories:0,protein:0,carbs:0,fat:0};for(let m of data.nutrition.today||[]){t.calories+=Number(m.calories)||0;t.protein+=Number(m.protein)||0;t.carbs+=Number(m.carbs)||0;t.fat+=Number(m.fat)||0}return{calories:Math.round(t.calories),protein:Math.round(t.protein*10)/10,carbs:Math.round(t.carbs*10)/10,fat:Math.round(t.fat*10)/10}}
function calcTotals(){let t={calories:0,protein:0,carbs:0,fat:0};for(let r of data.nutrition.calc||[]){let n=Math.max(0,Number(r.servings)||0);t.calories+=(Number(r.calories)||0)*n;t.protein+=(Number(r.protein)||0)*n;t.carbs+=(Number(r.carbs)||0)*n;t.fat+=(Number(r.fat)||0)*n}return{calories:Math.round(t.calories),protein:Math.round(t.protein*10)/10,carbs:Math.round(t.carbs*10)/10,fat:Math.round(t.fat*10)/10}}

function finishWorkout(){let p=data.plans[day];let h={id:Date.now()+Math.random(),date:new Date().toISOString(),plan:p.name,ex:p.ex.map((x,ei)=>({name:x[0],min:x[2],max:x[3],sets:Array.from({length:x[1]},(_,si)=>({weight:session[ei+'-'+si]?.weight||'',reps:session[ei+'-'+si]?.reps||''}))}))};data.history.push(h);let bw=$('bodyWeight');if(bw?.value)data.body.push({date:new Date().toISOString(),weight:bw.value});save();if(window.PT_CLOUD?.user)cloudSaveSession(h);session={};alert('Workout saved. Nice work.');show('today')}
document.addEventListener('click',async e=>{let t=e.target.closest('button');if(!t)return;if(t.dataset.nav){if(t.dataset.nav==='workouts'&&nav==='active'){show('workouts')}else show(t.dataset.nav);return}if(t.dataset.start!==undefined){day=Number(t.dataset.start);session={};show('active');return}if(t.dataset.guideToggle!==undefined){let g=t.closest('.guide');if(g){g.classList.toggle('hidden');t.textContent=g.classList.contains('hidden')?'Show guide':'Hide guide'}return}if(t.dataset.done){let key=t.dataset.done,s=session[key]||{};s.done=!s.done;session[key]=s;let ei=Number(key.split('-')[0]),type=data.plans[day].ex[ei]?.[4]||'compound';if(s.done){startTimer(type);renderActive()}else{renderActive()}return}if(t.dataset.timerAction!==undefined){if(timerRunning)stopTimer();else startTimer();return}if(t.dataset.timerReset!==undefined){resetTimer();return}if(t.id==='finish'){finishWorkout();return}if(t.id==='addFood'){data.nutrition.calc.push({food:'',servings:1,calories:'',protein:'',carbs:'',fat:''});save();renderNutrition();return}if(t.dataset.removeFood!==undefined){if(data.nutrition.calc.length>1)data.nutrition.calc.splice(Number(t.dataset.removeFood),1);save();renderNutrition();return}if(t.id==='resetCalc'){data.nutrition.calc=[{food:'',servings:1,calories:'',protein:'',carbs:'',fat:''}];save();renderNutrition();return}if(t.id==='addMeal'){let c=calcTotals();if(c.calories<=0&&c.protein<=0&&c.carbs<=0&&c.fat<=0)return alert('Enter at least one nutrition value.');let name=data.nutrition.calc.map(r=>r.food.trim()).filter(Boolean).join(' + ')||'Meal';data.nutrition.today.push({id:Date.now()+Math.random(),name,calories:c.calories,protein:c.protein,carbs:c.carbs,fat:c.fat});save();data.nutrition.calc=[{food:'',servings:1,calories:'',protein:'',carbs:'',fat:''}];renderNutrition();return}if(t.id==='clearNutrition'&&confirm("Clear today\'s nutrition log?")){data.nutrition.today=[];save();renderNutrition();return}if(t.id==='unit'){data.settings.unit=data.settings.unit==='lb'?'kg':'lb';save();renderSettings();return}if(t.id==='addDay'){data.plans.push({name:'New Workout',ex:[['New Exercise',3,8,12,'compound']]});day=data.plans.length-1;save();renderSettings();return}if(t.dataset.delday){if(data.plans.length<=1)return alert('Keep at least one workout day.');data.plans.splice(Number(t.dataset.delday),1);day=Math.min(day,data.plans.length-1);save();renderSettings();return}if(t.dataset.delex){let [p,x]=t.dataset.delex.split('-').map(Number);data.plans[p].ex.splice(x,1);save();renderSettings();return}if(t.dataset.addex){let p=Number(t.dataset.addex);data.plans[p].ex.push(['New Exercise',3,8,12,'compound']);save();renderSettings();return}if(t.id==='reset'&&confirm('Reset to the original 5-day program? History will stay.')){data.plans=JSON.parse(JSON.stringify(defaultPlans));save();renderSettings();return}if(t.id==='ptSignIn'){await ptAuth();return}if(t.id==='ptSignOut'){await ptSignOut();return}if(t.id==='ptSync'){await cloudSaveAll();await cloudLoadHistory();renderCurrent();alert('Synced.');return}});
document.addEventListener('input',e=>{let t=e.target;if(t.dataset.rest){let v=Math.max(30,Math.min(600,Number(t.value)||30));data.settings.rest[t.dataset.rest]=v;save();if(t.dataset.rest===timerType&&!timerRunning)timerSeconds=v;return}if(t.dataset.target){let v=Math.max(0,Number(t.value)||0);data.nutrition.targets[t.dataset.target]=v;save();renderNutrition();return}if(t.dataset.calc){let i=Number(t.dataset.i);if(data.nutrition.calc[i]){data.nutrition.calc[i][t.dataset.calc]=t.dataset.calc==='food'?t.value:(Number(t.value)||0);renderNutrition();let el=document.activeElement;if(el&&el.dataset&&el.dataset.calc===t.dataset.calc){try{el.focus();el.setSelectionRange(el.value.length,el.value.length)}catch(_){}}}return}if(t.dataset.k){session[t.dataset.k]=session[t.dataset.k]||{};session[t.dataset.k][t.dataset.f]=t.value;return}if(t.dataset.pname){data.plans[Number(t.dataset.pname)].name=t.value;save();return}if(t.dataset.field){let p=Number(t.dataset.p),x=Number(t.dataset.e),map={name:0,sets:1,min:2,max:3,type:4};data.plans[p].ex[x][map[t.dataset.field]]=(t.dataset.field==='name'||t.dataset.field==='type')?t.value:Number(t.value);save()}});
const PT_CLOUD={client:(window.PT_SUPABASE_URL&&window.PT_SUPABASE_ANON_KEY&&!window.PT_SUPABASE_URL.includes('YOUR_')&&!window.PT_SUPABASE_ANON_KEY.includes('YOUR_'))?supabase.createClient(window.PT_SUPABASE_URL,window.PT_SUPABASE_ANON_KEY):null,user:null};window.PT_CLOUD=PT_CLOUD;
async function ptCloudInit(){if(!PT_CLOUD.client)return;let r=await PT_CLOUD.client.auth.getUser();PT_CLOUD.user=r.data.user||null}
async function cloudSaveAll(){let c=PT_CLOUD.client,u=PT_CLOUD.user;if(!c||!u)return;try{for(let wi=0;wi<data.plans.length;wi++){let p=data.plans[wi];let {data:w,error}=await c.from('pt_workouts').upsert({user_id:u.id,name:p.name,sort_order:wi},{onConflict:'user_id,sort_order'}).select().single();if(error)throw error;for(let ei=0;ei<p.ex.length;ei++){let e=p.ex[ei];await c.from('pt_exercises').upsert({user_id:u.id,workout_id:w.id,name:e[0],sets:e[1],min_reps:e[2],max_reps:e[3],exercise_type:e[4],sort_order:ei},{onConflict:'user_id,workout_id,sort_order'})}}if(data.body.length)await c.from('pt_body_weight').upsert(data.body.map(x=>({user_id:u.id,recorded_at:x.date,weight:Number(x.weight)})),{onConflict:'user_id,recorded_at'})}catch(e){console.warn('Cloud save',e)}}
async function cloudLoadProgram(){let c=PT_CLOUD.client,u=PT_CLOUD.user;if(!c||!u)return false;let {data:ws,error}=await c.from('pt_workouts').select('id,name,sort_order,pt_exercises(*)').eq('user_id',u.id).order('sort_order');if(error||!ws?.length)return false;data.plans=ws.map(w=>({name:w.name,ex:(w.pt_exercises||[]).sort((a,b)=>a.sort_order-b.sort_order).map(e=>[e.name,e.sets,e.min_reps,e.max_reps,e.exercise_type])}));let {data:bw}=await c.from('pt_body_weight').select('recorded_at,weight').eq('user_id',u.id).order('recorded_at');data.body=(bw||[]).map(x=>({date:x.recorded_at,weight:x.weight}));save();return true}
async function cloudSaveSession(h){let c=PT_CLOUD.client,u=PT_CLOUD.user;if(!c||!u)return;try{let {data:s,error}=await c.from('pt_sessions').insert({user_id:u.id,workout_name:h.plan,completed_at:h.date}).select().single();if(error)throw error;let rows=[];h.ex.forEach(ex=>ex.sets.forEach((set,i)=>rows.push({user_id:u.id,session_id:s.id,exercise_name:ex.name,set_number:i+1,weight:set.weight===''?null:Number(set.weight),reps:set.reps===''?null:Number(set.reps),min_reps:ex.min,max_reps:ex.max})));if(rows.length)await c.from('pt_sets').insert(rows)}catch(e){console.warn('Cloud session',e)}}
async function cloudLoadHistory(){let c=PT_CLOUD.client,u=PT_CLOUD.user;if(!c||!u)return;let {data:ss}=await c.from('pt_sessions').select('id,workout_name,completed_at,pt_sets(*)').eq('user_id',u.id).order('completed_at');if(!ss)return;data.history=ss.map(s=>{let groups={};(s.pt_sets||[]).forEach(x=>{groups[x.exercise_name]??={name:x.exercise_name,min:x.min_reps,max:x.max_reps,sets:[]};groups[x.exercise_name].sets.push({weight:x.weight??'',reps:x.reps??''})});return{id:s.id,date:s.completed_at,plan:s.workout_name,ex:Object.values(groups)}});save()}
async function ptAuth(){if(!PT_CLOUD.client)return alert('Cloud database is not configured. Add your Supabase URL and publishable/anon key to supabase-config.js.');let email=prompt('Email:');if(!email)return;let password=prompt('Password (6+ characters):');if(!password)return;let r=await PT_CLOUD.client.auth.signInWithPassword({email,password});if(r.error){let s=await PT_CLOUD.client.auth.signUp({email,password});if(s.error)return alert(s.error.message);alert('Account created. Confirm your email if required, then sign in.');return}PT_CLOUD.user=r.data.user;await cloudLoadProgram();await cloudLoadHistory();show('today')}
async function ptSignOut(){if(PT_CLOUD.client)await PT_CLOUD.client.auth.signOut();PT_CLOUD.user=null;show('settings')}
(async()=>{await ptCloudInit();if(PT_CLOUD.user){await cloudLoadProgram();await cloudLoadHistory()}renderToday()})();
</script>
